{% extends 'base.html' %}

{% block title %}
login
{% endblock %}

{% block content %}
<div class="auth-card">
<h3>Login</h3>

<!-- FIX: url_for('login') -> url_for('auth.login') -- login() lives on the 'auth' blueprint,
     so its real endpoint name is auth.login, not login -->
<form action="{{ url_for('auth.login') }}" method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required><br><br>
    <input type="submit" name="submit" value="Login">
</form>

<p class="auth-switch"><a href="{{url_for('auth.register')}}">New User?</a></p>
</div>
{% endblock %}
